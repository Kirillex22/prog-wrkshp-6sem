mutation {
  registerUser(
    login: "newuser"
    password: "password123"
    full_name: "New User"
  ) {
    userid
    login
    fullname
    role
  }
}

mutation {
  loginUser(login: "newuser", password: "password123") {
    access_token
    refresh_token
  }
}

# -> + request header: "token": "Bearer {access_token}"
