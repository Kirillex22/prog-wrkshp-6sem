  transactionAdded {
    userid
    type
    count
    timestamp
  }
}

mutation {
  addTransaction(type: "topup", count: 1500.0, source: "job") {
    userid
    type
    count
    timestamp
  }
}

query {
  generateAndDownloadReport(month: "2025-06", type: "json")
}

query {
  getUser {
    userid
    login
    role
    full_name
  }
}

query {
  getTransactions(month: "2025-06") {
    userid
    type
    count
